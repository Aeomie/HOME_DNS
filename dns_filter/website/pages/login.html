<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DNS Filter | Admin login</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="login-page">
<div class="shell">
  <aside>
    <a class="brand" href="/"><div class="brand-mark">D</div><span>DNS Filter</span></a>
    <nav>
      <a href="/"><span>▣ &nbsp; Dashboard</span><b>▣</b></a>
      <a href="/manage"><span>⚙ &nbsp; DNS policy</span><b>⚙</b></a>
      <div class="subnav">
        <a href="/manage/resolvers"><span>Resolvers</span><b>R</b></a>
        <a href="/manage/blocked"><span>Blocked domains</span><b>B</b></a>
        <a href="/manage/allowed"><span>Allowed domains</span><b>A</b></a>
      </div>
      <a href="/internal/swagger"><span>⌘ &nbsp; API docs</span><b>⌘</b></a>
      <a class="active" href="/admin/login"><span>🔐 &nbsp; Admin login</span><b>🔐</b></a>
    </nav>
    <div class="side-status"><div>Service status</div><p class="online">● Online</p><small>Local DNS filter</small></div>
  </aside>
  <main>
    <div class="login-panel">
      <h1>Admin login</h1>
      <p>Generate a one-time token. The token is printed in the DNS server console and expires after two minutes.</p>
      <button id="generate" type="button">Generate security token</button>
      <p id="challenge-message"></p>
      <form id="login">
        <label for="username">Admin username</label>
        <input id="username" name="username" required autocomplete="username">
        <label for="password">Admin password</label>
        <input id="password" name="password" required type="password" autocomplete="current-password">
        <label for="token">Security token</label>
        <input id="token" name="token" required autocomplete="one-time-code">
        <button type="submit">Log in</button>
      </form>
      <p id="message"></p>
    </div>
  </main>
</div>
<script>
const message = document.querySelector('#message');
document.querySelector('#generate').addEventListener('click', async () => {
  const response = await fetch('/admin/challenge', {method:'POST'});
  const data = await response.json();
  document.querySelector('#challenge-message').textContent = data.status;
});
document.querySelector('#login').addEventListener('submit', async event => {
  event.preventDefault();
  const form = new FormData(event.target);
  const response = await fetch('/admin/login', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(Object.fromEntries(form))
  });
  const data = await response.json();
  if (!response.ok) { message.textContent = data.detail || 'Login failed'; return; }
  window.location.href = '/manage';
});
</script>
</body>
</html>

[project]
name = "dns-filter"
version = "0.1.0"
description = "A lightweight home DNS filtering server"
authors = [
    {name = "Aeon"}
]
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi (>=0.115.0,<1.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "uvicorn (>=0.30.0,<1.0.0)",
]

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
]

[project.scripts]
dns-filter-create-admin = "dns_filter.admin:create_admin"

[tool.pytest.ini_options]
testpaths = ["tests"]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
